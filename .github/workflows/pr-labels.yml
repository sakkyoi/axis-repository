name: PR Labels

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-note-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check release-note labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const hasType = labels.some((label) => label.startsWith("type/"));
            const hasReleaseDecision = labels.some((label) => label.startsWith("release/"));
            if (!hasType) {
              core.setFailed("Pull requests need one type/* label. Conventional PR labeling should add this automatically from the PR title.");
            }
            if (!hasReleaseDecision) {
              core.setFailed("Pull requests need one release/* label. Automation adds an initial release label, and maintainers should review it before merge.");
            }
