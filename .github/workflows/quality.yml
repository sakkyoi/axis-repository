name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    # src/admin-ui-assets/generated.ts is a committed build artifact. Nothing at
    # runtime notices when it drifts from packages/admin-ui/src, so the worker
    # would quietly serve a stale UI. Rebuild it and fail if the result differs
    # from what is committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm --filter @axis-repository/admin-ui build

      - run: node packages/runtime-cloudflare/scripts/generate-admin-ui-assets.mjs

      - name: Check embedded admin UI assets are up to date
        run: |
          if ! git diff --quiet -- packages/runtime-cloudflare/src/admin-ui-assets/generated.ts; then
            echo "::error::Embedded admin UI assets are stale. Run 'pnpm build' and commit the regenerated generated.ts."
            git diff --stat -- packages/runtime-cloudflare/src/admin-ui-assets/generated.ts
            exit 1
          fi

  cloudflare-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm build

      - run: pnpm deploy:dry-run:worker

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm coverage

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm check:audit
