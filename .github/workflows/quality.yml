name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    # Admin UI assets are generated for the Worker bundle at build time. This
    # keeps the generated asset source out of version control while still
    # proving a clean checkout can produce the module the Worker build embeds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm --filter @axis-repository/runtime-cloudflare build

      - name: Check embedded admin UI assets were generated
        run: test -f packages/runtime-cloudflare/generated/admin-ui-assets.ts

      - name: Check asset generation leaves tracked files clean
        run: git diff --quiet

  cloudflare-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm build

      - run: pnpm deploy:dry-run:worker

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm coverage

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node

      - run: pnpm check:audit
